name: Update playlists

on:
  schedule:
    - cron: '17 4 * * *'   # daily, 04:17 UTC
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    branches: [main]

permissions:
  contents: write   # to push the playlists branch
  pages: write
  id-token: write

concurrency:
  group: update-playlists
  cancel-in-progress: true

env:
  # Playlists are served straight from the "playlists" branch, which works for
  # any public repository with no extra settings. GitHub Pages is optional.
  SITE_URL: https://raw.githubusercontent.com/${{ github.repository }}/playlists

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build playlists and the TV guide channel list
        run: node scripts/build.mjs --refresh

      # TV guide, using iptv-org's own grabber. If a guide site is down the
      # playlists are still published, just without a fresh guide.
      - name: Grab TV guide
        continue-on-error: true
        timeout-minutes: 45
        run: |
          git clone --depth 1 https://github.com/iptv-org/epg.git ../epg
          cd ../epg
          npm ci --no-audit --no-fund
          mkdir -p "$GITHUB_WORKSPACE/data/guides"
          npm run grab --- \
            --channels="$GITHUB_WORKSPACE/data/guide.channels.xml" \
            --output="$GITHUB_WORKSPACE/data/guides/guide.xml" \
            --gzip="$GITHUB_WORKSPACE/data/guides/guide.xml.gz" \
            --days="$(node -p "require('$GITHUB_WORKSPACE/config.json').guides.days")" \
            --maxConnections=5

      - name: Check which streams answer
        run: node scripts/check.mjs

      - name: Rebuild with check results and guide
        run: node scripts/build.mjs

      # Replace the playlists branch with today's files. It always holds a
      # single commit, so the repository does not grow day by day.
      - name: Publish to the playlists branch
        run: |
          # Only the favourites playlist and the TV guide are published.
          mkdir ../publish
          cp dist/mine.m3u ../publish/
          if [ -d dist/guides ]; then cp -r dist/guides ../publish/; fi
          cd ../publish
          git init -q -b playlists
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Playlists built $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" playlists

      # Only used if GitHub Pages is switched on (Settings -> Pages -> Source:
      # GitHub Actions). It adds the channel browser website.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true   # Pages is optional; the playlists are already published
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
